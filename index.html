<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyTuner</title>
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="application-name" content="MyTuner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="css/radio.css">
<link rel="manifest" href="manifest.webmanifest">
<script>
window.__onGCastApiAvailable = function (isAvailable) {
  window.__castApiAvailable = Boolean(isAvailable);
  window.dispatchEvent(new Event('cast-api'));
};
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
<svg class="filters" aria-hidden="true">
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.15" numOctaves="2" seed="4"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<div class="radio" id="radio">
  <div class="metal" aria-hidden="true"></div>
  <div class="sheen" aria-hidden="true"></div>

  <div class="panel">
    <section class="bezel" id="bezel">
      <div class="glass" id="glass">
        <div class="dial">
          <div class="band is-active" id="bandFm" data-band="fm">
            <div class="band-tag">FM</div>
            <div class="band-body" data-band="fm">
              <svg class="scale" id="scaleFm"></svg>
              <div class="needle" id="needleFm"></div>
              <div class="readout">
                <span class="freq" id="freqFm">98.1</span>
                <span class="unit">MHz</span>
              </div>
            </div>
          </div>
          <div class="band" id="bandAm" data-band="am">
            <div class="band-tag">AM</div>
            <div class="band-body" data-band="am">
              <svg class="scale" id="scaleAm"></svg>
              <div class="needle" id="needleAm"></div>
              <div class="readout">
                <span class="freq" id="freqAm">810</span>
                <span class="unit">kHz</span>
              </div>
            </div>
          </div>
          <div class="dial-foot">
            <div class="station" id="stationLine" aria-live="polite"></div>
            <div class="eq">
              <div class="eq-unit">
                <span class="eq-label">BASS</span>
                <div class="mini" id="bassKnob" role="slider" aria-label="Bassi" aria-valuemin="-12" aria-valuemax="12" aria-valuenow="0" tabindex="0"><i></i></div>
              </div>
              <div class="eq-unit">
                <span class="eq-label">TREBLE</span>
                <div class="mini" id="trebleKnob" role="slider" aria-label="Alti" aria-valuemin="-12" aria-valuemax="12" aria-valuenow="0" tabindex="0"><i></i></div>
              </div>
            </div>
          </div>
        </div>

        <div class="spec">
          <div class="spec-title">SPECTRUM ANALYZER</div>
          <div class="spec-well">
            <div class="bars" id="bars"></div>
            <div class="spec-labels" id="specLabels"></div>
          </div>
        </div>
        <div class="glass-reflect" aria-hidden="true"></div>
      </div>
    </section>

    <section class="controls">
      <div class="group power-stack">
        <div class="ctrl">
          <div class="lbl">POWER</div>
          <button type="button" class="lamp power" id="btnPower" aria-label="Accensione" aria-pressed="false"><span></span></button>
        </div>
        <div class="ctrl">
          <div class="lbl">STOP</div>
          <button type="button" class="lamp stop" id="btnStop" aria-label="Stop" aria-pressed="false"><span></span></button>
        </div>
      </div>

      <div class="group vol-group">
        <div class="lbl">VOLUME</div>
        <div class="vol-wrap" id="volWrap">
          <div class="vol-nums" id="volNums"></div>
          <div class="knob vol" id="volKnob" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5" tabindex="0">
            <div class="knurl"></div>
            <div class="face"><i class="mark"></i></div>
          </div>
          <div class="knob-sheen vol-sheen" aria-hidden="true"></div>
        </div>
      </div>

      <div class="group tune-group">
        <div class="lbl">TUNING</div>
        <div class="knob-slot">
          <div class="knob tune" id="tuneKnob" role="slider" aria-label="Sintonia" tabindex="0">
            <div class="knurl"></div>
            <div class="cap"></div>
          </div>
          <div class="knob-sheen" aria-hidden="true"></div>
        </div>
        <div class="channel-row">
          <button type="button" class="ch-btn" id="btnChDown" aria-label="Canale precedente">CH −</button>
          <button type="button" class="ch-btn" id="btnChUp" aria-label="Canale successivo">CH +</button>
        </div>
      </div>

      <div class="group modes">
        <div class="mode">
          <div class="lbl compact" id="lblBand"><span class="is-active" data-v="fm">FM</span>/<span data-v="am">AM</span></div>
          <button type="button" class="key" id="btnBand" aria-label="FM o AM"></button>
        </div>
        <div class="mode">
          <div class="lbl compact" id="lblStereo"><span data-v="mo">MONO</span>/<span class="is-active" data-v="st">STEREO</span></div>
          <button type="button" class="key" id="btnMono" aria-label="Mono o stereo"></button>
        </div>
        <div class="mode">
          <div class="lbl compact" id="lblAuto"><span data-v="auto">AUTO</span>/<span class="is-active" data-v="man">MANUAL</span></div>
          <button type="button" class="key" id="btnAuto" aria-label="Ricerca automatica o manuale"></button>
        </div>
        <div class="mode">
          <div class="lbl compact">PRESET</div>
          <button type="button" class="key" id="btnPreset" aria-label="Memorie. Tieni premuto per salvare."></button>
        </div>
        <div class="mode">
          <div class="lbl compact" id="lblCast">CAST</div>
          <button type="button" class="key cast" id="btnCast" aria-label="Trasmetti a Google Home" aria-pressed="false"></button>
        </div>
      </div>
    </section>
  </div>
  <div class="vignette" aria-hidden="true"></div>
</div>
<audio id="player" playsinline preload="none"></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
